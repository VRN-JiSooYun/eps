services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eps
      POSTGRES_USER: eps
      POSTGRES_PASSWORD: eps
    ports:
      - "5432:5432"
    volumes:
      - eps_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eps -d eps"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    env_file:
      - .env
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://eps:eps@db:5432/eps?sslmode=disable
      JWT_SECRET: local-dev-secret-change-me
      FRONTEND_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"


  admin:
    build:
      context: ./admin
      dockerfile: backend/Dockerfile
      args:
        VITE_BASE_PATH: /eps-admin/
        VITE_API_BASE_URL: /eps-admin/api
    environment:
      PORT: 8080
      DATABASE_URL: postgres://eps:eps@db:5432/eps?sslmode=disable
      JWT_SECRET: local-dev-admin-secret-change-me
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin1234
      BASE_PATH: /eps-admin
      FRONTEND_ORIGIN: http://localhost:18080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18080:8080"

volumes:
  eps_postgres:
