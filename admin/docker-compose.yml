services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eps
      POSTGRES_USER: eps
      POSTGRES_PASSWORD: eps
    ports:
      - "5432:5432"
    volumes:
      - eps-admin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eps -d eps"]
      interval: 5s
      timeout: 5s
      retries: 10

  admin:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://eps:eps@postgres:5432/eps?sslmode=disable
      JWT_SECRET: change-me-in-production
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin1234
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  eps-admin-postgres:
